<text x="440" y="396" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">La red funciona. El equipo está arrancado.</text>
<text x="440" y="422" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">Lo que lleva once días sin volver a empezar es la aplicación.</text>
