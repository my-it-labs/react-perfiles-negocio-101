<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" role="img">
<title>Anexo que la oferta debe rellenar: rutas, recarga, frases, exclusiones y el sistema del dato. Una celda vacía deja la oferta incompleta.</title>
<rect width="100%" height="100%" fill="#f3efe6"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#1e3a5f"/>
  </marker>
  <marker id="arrSoft" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#5c6b7a"/>
  </marker>
  <marker id="arrCoral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#9a4638"/>
  </marker>
</defs>
<text x="48" y="48" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e2430">Anexo de la oferta</text>
<rect x="28" y="70" width="824" height="52" rx="10" fill="#d5ead6" stroke="#2f6b3a" stroke-width="1.5"/>
<text x="48" y="102" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">HTML ya escrito</text>
<text x="820" y="102" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#1e2430">/lineas/L2</text>
<rect x="28" y="134" width="824" height="52" rx="10" fill="#d5ead6" stroke="#2f6b3a" stroke-width="1.5"/>
<text x="48" y="166" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Al recargar el detalle</text>
<text x="820" y="166" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#1e2430">sigue en esa incidencia</text>
<rect x="28" y="198" width="824" height="52" rx="10" fill="#d5ead6" stroke="#2f6b3a" stroke-width="1.5"/>
<text x="48" y="230" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Vacío y error</text>
<text x="820" y="230" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#1e2430">dos frases distintas</text>
<rect x="28" y="262" width="824" height="52" rx="10" fill="#d5ead6" stroke="#2f6b3a" stroke-width="1.5"/>
<text x="48" y="294" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Fuera de este encargo</text>
<text x="820" y="294" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#1e2430">sin app de tienda</text>
<rect x="28" y="326" width="824" height="52" rx="10" fill="#f6d5ce" stroke="#9a4638" stroke-width="1.5"/>
<text x="48" y="358" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">De qué sistema sale</text>
<text x="820" y="358" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#1e2430">(vacío)</text>
<text x="440" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">La fila en rojo no se completa de palabra en la reunión. Esa oferta aún no ha decidido el dato.</text>
</svg>
