<rect x="28" y="36" width="268" height="300" rx="14" fill="#fffdf8" stroke="#2f6b3a" stroke-width="2"/>
<rect x="28" y="36" width="268" height="64" rx="14" fill="#d5ead6" stroke="#2f6b3a" stroke-width="0"/>
<rect x="28" y="78" width="268" height="22" rx="0" fill="#d5ead6" stroke="#d5ead6" stroke-width="0"/>
<text x="162" y="76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e2430">Entorno de construcción</text>
<rect x="46" y="130" width="232" height="44" rx="8" fill="#f3efe6" stroke="#c9c1b4" stroke-width="1.5"/>
<text x="162" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2430">Una máquina. Vale una virtual.</text>
<rect x="46" y="188" width="232" height="44" rx="8" fill="#f3efe6" stroke="#c9c1b4" stroke-width="1.5"/>
<text x="162" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2430">Librerías, con versión y copia.</text>
<rect x="46" y="246" width="232" height="44" rx="8" fill="#f3efe6" stroke="#c9c1b4" stroke-width="1.5"/>
<text x="162" y="274" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2430">Documento de pasos.</text>
<rect x="312" y="36" width="268" height="300" rx="14" fill="#fffdf8" stroke="#2f6b3a" stroke-width="2"/>
<rect x="312" y="36" width="268" height="64" rx="14" fill="#d5ead6" stroke="#2f6b3a" stroke-width="0"/>
<rect x="312" y="78" width="268" height="22" rx="0" fill="#d5ead6" stroke="#d5ead6" stroke-width="0"/>
<text x="446" y="76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e2430">Pruebas automáticas</text>
<rect x="330" y="130" width="232" height="44" rx="8" fill="#f3efe6" stroke="#c9c1b4" stroke-width="1.5"/>
<text x="446" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2430">Unitarias y de extremo a extremo.</text>
<rect x="330" y="188" width="232" height="44" rx="8" fill="#f3efe6" stroke="#c9c1b4" stroke-width="1.5"/>
<text x="446" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2430">En un entorno propio.</text>
<rect x="330" y="246" width="232" height="44" rx="8" fill="#f3efe6" stroke="#c9c1b4" stroke-width="1.5"/>
<text x="446" y="274" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2430">Condición de recepción.</text>
<rect x="596" y="36" width="268" height="300" rx="14" fill="#fffdf8" stroke="#2f6b3a" stroke-width="2"/>
<rect x="596" y="36" width="268" height="64" rx="14" fill="#d5ead6" stroke="#2f6b3a" stroke-width="0"/>
<rect x="596" y="78" width="268" height="22" rx="0" fill="#d5ead6" stroke="#d5ead6" stroke-width="0"/>
<text x="730" y="76" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e2430">Anexo de pantallas</text>
<rect x="614" y="130" width="232" height="44" rx="8" fill="#f3efe6" stroke="#c9c1b4" stroke-width="1.5"/>
<text x="730" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2430">Medida, resolución, orientación.</text>
<rect x="614" y="188" width="232" height="44" rx="8" fill="#f3efe6" stroke="#c9c1b4" stroke-width="1.5"/>
<text x="730" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2430">Dónde van y cuántas.</text>
<rect x="614" y="246" width="232" height="44" rx="8" fill="#f3efe6" stroke="#c9c1b4" stroke-width="1.5"/>
<text x="730" y="274" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2430">Dibujo de cada pantalla.</text>
<text x="440" y="380" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">Tres ámbitos del alcance. No son tres filas del pliego.</text>
<text x="440" y="408" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">Las filas que los cubren están en el ejemplo, en las familias de siempre.</text>
</svg>
