<text x="260" y="301" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">Evolutivos posteriores a la recepción</text>
<line x1="28" y1="312" x2="852" y2="312" stroke="#e2dcd0" stroke-width="1"/>
<rect x="30" y="314" width="820" height="33" rx="3" fill="#d5ead6" stroke="#2f6b3a" stroke-width="1.5"/>
<text x="36" y="336" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f6b3a">+</text>
<text x="52" y="336" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e2430">Entorno de construcción</text>
<text x="260" y="336" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">Componentes de terceros y pasos para reconstruir</text>
<line x1="28" y1="347" x2="852" y2="347" stroke="#e2dcd0" stroke-width="1"/>
<rect x="30" y="349" width="820" height="33" rx="3" fill="#d5ead6" stroke="#2f6b3a" stroke-width="1.5"/>
<text x="36" y="371" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f6b3a">+</text>
<text x="52" y="371" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e2430">Pruebas automáticas</text>
<text x="260" y="371" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">Y el documento para lanzarlas en un equipo limpio</text>
<line x1="28" y1="382" x2="852" y2="382" stroke="#e2dcd0" stroke-width="1"/>
<rect x="30" y="384" width="820" height="33" rx="3" fill="#d5ead6" stroke="#2f6b3a" stroke-width="1.5"/>
<text x="36" y="406" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#2f6b3a">+</text>
<text x="52" y="406" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e2430">Anexo de pantallas</text>
<text x="260" y="406" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">Medidas, resoluciones, orientaciones y unidades</text>
<line x1="28" y1="417" x2="852" y2="417" stroke="#e2dcd0" stroke-width="1"/>
<text x="440" y="462" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">Las tres últimas no suelen estar. Lo que no está en el listado, no se entrega.</text>
</svg>
