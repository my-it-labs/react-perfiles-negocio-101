<text x="260" y="161" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">Pantallas, CPU, carcasas y soportes</text>
<line x1="28" y1="172" x2="852" y2="172" stroke="#e2dcd0" stroke-width="1"/>
<text x="52" y="196" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e2430">Software</text>
<text x="260" y="196" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">La aplicación y la herramienta de gestión</text>
<line x1="28" y1="207" x2="852" y2="207" stroke="#e2dcd0" stroke-width="1"/>
<text x="52" y="231" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e2430">Formación</text>
<text x="260" y="231" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="400" fill="#3d4654">Al personal que programa los contenidos</text>
