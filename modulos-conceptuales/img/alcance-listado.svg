<text x="44" y="52" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#fffdf8">LISTADO RESUMEN DE SUMINISTROS Y SERVICIOS</text>
<text x="44" y="86" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e2430">Concepto</text>
<text x="260" y="86" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" fill="#1e2430">Descripción</text>
<line x1="28" y1="96" x2="852" y2="96" stroke="#c9c1b4" stroke-width="1.5"/>
