<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" role="img">
<title>Listado resumen de suministros y servicios con tres líneas añadidas: entorno de construcción, pruebas automáticas y anexo de pantallas.</title>
