<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img">
<title>Contrato de una operación: el panel pide las incidencias de L2 y el pliego traduce lista, vacío y fallo a tres frases.</title>
<rect width="100%" height="100%" fill="#f3efe6"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#1e3a5f"/>
  </marker>
  <marker id="arrSoft" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#5c6b7a"/>
  </marker>
  <marker id="arrCoral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#9a4638"/>
  </marker>
</defs>
<rect x="28" y="36" width="250" height="150" rx="14" fill="#f8e6b0" stroke="#8d6a12" stroke-width="2"/>
<text x="153" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e2430">Panel</text>
<text x="153" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#8d6a12">pide incidencias</text>
<text x="153" y="146" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#8d6a12">de L2</text>
<line x1="278" y1="110" x2="330" y2="110" stroke="#1e3a5f" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="334" y="36" width="518" height="150" rx="14" fill="#fffdf8" stroke="#2c5f94" stroke-width="2"/>
<text x="354" y="72" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">GET  /incidencias?linea=L2</text>
<text x="354" y="102" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">Sistema de incidencias de la casa</text>
<text x="354" y="132" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">Campos: id, linea, gravedad, texto</text>
<text x="354" y="160" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a4638">Sin teléfono ni nota interna</text>
<rect x="28" y="220" width="268" height="120" rx="12" fill="#d5ead6" stroke="#2f6b3a" stroke-width="2"/>
<text x="46" y="262" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">200 y una lista</text>
<text x="46" y="294" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">Se ven las filas</text>
<rect x="312" y="220" width="268" height="120" rx="12" fill="#fffdf8" stroke="#2c333d" stroke-width="2"/>
<text x="330" y="262" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">200 y lista vacía</text>
<text x="330" y="294" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">«No hay incidencias.»</text>
<rect x="596" y="220" width="268" height="120" rx="12" fill="#f6d5ce" stroke="#9a4638" stroke-width="2"/>
<text x="614" y="262" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2430">Fallo</text>
<text x="614" y="294" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">«No se han podido cargar.»</text>
<text x="440" y="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">Misma operación, tres finales. La frase la fija el pliego; el código HTTP va al lado.</text>
<text x="440" y="460" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">Un boceto sin esta ficha se rellena con un JSON de mentira.</text>
</svg>
