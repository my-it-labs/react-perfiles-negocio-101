<rect x="174" y="158" width="24" height="36" rx="3" fill="#c9c1b4" stroke="#8a8175" stroke-width="1.5"/>
<rect x="98" y="190" width="120" height="70" rx="8" fill="#f8e6b0" stroke="#8d6a12" stroke-width="2"/>
<rect x="136" y="174" width="44" height="18" rx="9" fill="#f3efe6" stroke="#8d6a12" stroke-width="2"/>
<polygon points="364,180 440,126 516,180" fill="#2c5f94"/>
<rect x="372" y="180" width="136" height="80" rx="4" fill="#d9e6f2" stroke="#2c5f94" stroke-width="2"/>
<rect x="386" y="196" width="48" height="28" rx="3" fill="#fffdf8" stroke="#2c5f94" stroke-width="1.5"/>
<rect x="446" y="196" width="48" height="28" rx="3" fill="#fffdf8" stroke="#2c5f94" stroke-width="1.5"/>
<rect x="386" y="234" width="108" height="18" rx="3" fill="#fffdf8" stroke="#2c5f94" stroke-width="1.5"/>
<rect x="636" y="146" width="20" height="20" rx="3" fill="#e2dcd0" stroke="#8a8175" stroke-width="1.5"/>
<rect x="662" y="146" width="20" height="20" rx="3" fill="#e2dcd0" stroke="#8a8175" stroke-width="1.5"/>
<rect x="688" y="146" width="20" height="20" rx="3" fill="#e2dcd0" stroke="#8a8175" stroke-width="1.5"/>
<line x1="650" y1="182" x2="650" y2="202" stroke="#1e3a5f" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="624" y="206" width="124" height="56" rx="6" fill="#d5ead6" stroke="#2f6b3a" stroke-width="2"/>
<text x="686" y="240" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f6b3a">paquete</text>
<text x="440" y="448" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#3d4654">Las tres palabras que hay que tener claras antes de discutir una oferta.</text>
</svg>
