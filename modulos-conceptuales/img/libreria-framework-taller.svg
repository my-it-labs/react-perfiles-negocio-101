<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480" role="img">
<title>Tres paneles: la librería como caja de herramientas, el framework como casa ya construida y el taller como mesa de empaquetar.</title>
<rect width="100%" height="100%" fill="#f3efe6"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#1e3a5f"/>
  </marker>
  <marker id="arrSoft" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#5c6b7a"/>
  </marker>
  <marker id="arrCoral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#9a4638"/>
  </marker>
</defs>
<rect x="28" y="28" width="260" height="380" rx="16" fill="#fffdf8" stroke="#e2dcd0" stroke-width="1.5"/>
<text x="52" y="66" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e2430">Librería</text>
<text x="52" y="92" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6570">Una caja de herramientas</text>
<text x="52" y="304" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">Tú llevas la obra.</text>
<text x="52" y="328" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">Coges la que te hace falta.</text>
<rect x="52" y="344" width="212" height="36" rx="8" fill="#d9e6f2" stroke="#2c5f94" stroke-width="1.5"/>
<text x="158" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">React es esto.</text>
<rect x="310" y="28" width="260" height="380" rx="16" fill="#fffdf8" stroke="#e2dcd0" stroke-width="1.5"/>
<text x="334" y="66" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e2430">Framework</text>
<text x="334" y="92" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6570">Una casa ya construida</text>
<text x="334" y="304" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">Las paredes vienen puestas.</text>
<text x="334" y="328" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">Tú amueblas las habitaciones.</text>
<rect x="334" y="344" width="212" height="36" rx="8" fill="#d9e6f2" stroke="#2c5f94" stroke-width="1.5"/>
<text x="440" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Next.js es esto.</text>
<rect x="592" y="28" width="260" height="380" rx="16" fill="#fffdf8" stroke="#e2dcd0" stroke-width="1.5"/>
<text x="616" y="66" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e2430">Taller</text>
<text x="616" y="92" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#5c6570">Una mesa de empaquetar</text>
<text x="616" y="304" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">Prepara el paquete y se apaga.</text>
<text x="616" y="328" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#3d4654">No deja nada suyo encendido.</text>
<rect x="616" y="344" width="212" height="36" rx="8" fill="#d9e6f2" stroke="#2c5f94" stroke-width="1.5"/>
<text x="722" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" fill="#1e3a5f">Vite es esto.</text>
