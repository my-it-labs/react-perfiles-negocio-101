<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img">
<title>Dos cosas distintas en el mismo expediente: la pantalla del público, sin nadie delante, y el puesto del personal, con usuario y contraseña.</title>
<rect width="100%" height="100%" fill="#f3efe6"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#1e3a5f"/>
  </marker>
  <marker id="arrSoft" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#5c6b7a"/>
  </marker>
  <marker id="arrCoral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#9a4638"/>
  </marker>
</defs>
<rect x="48" y="48" width="360" height="200" rx="10" fill="#1e2430" stroke="#1e2430" stroke-width="0"/>
<rect x="60" y="60" width="336" height="176" rx="6" fill="#16222e" stroke="#0d1620" stroke-width="1.5"/>
<text x="80" y="104" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#9fb4c7">Próximo paso</text>
<text x="80" y="148" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" fill="#fffdf8">3 min</text>
<text x="80" y="196" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#9fb4c7">Siguiente: 11 min</text>
<text x="48" y="282" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">Nadie se identifica.</text>
<text x="48" y="306" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">Nadie comparte su dirección.</text>
<text x="48" y="330" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">Encendida siempre.</text>
<rect x="472" y="48" width="360" height="200" rx="10" fill="#fffdf8" stroke="#2c333d" stroke-width="2"/>
<rect x="472" y="48" width="360" height="30" rx="10" fill="#2c333d" stroke="#2c333d" stroke-width="0"/>
<rect x="472" y="64" width="360" height="14" rx="0" fill="#2c333d" stroke="#2c333d" stroke-width="0"/>
<text x="652" y="69" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#fffdf8">Programación de contenidos</text>
<rect x="562" y="100" width="180" height="126" rx="8" fill="#f3efe6" stroke="#c9c1b4" stroke-width="1.5"/>
<text x="580" y="128" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e2430">Entrar</text>
<rect x="580" y="140" width="144" height="20" rx="4" fill="#fffdf8" stroke="#c9c1b4" stroke-width="1.5"/>
<rect x="580" y="168" width="144" height="20" rx="4" fill="#fffdf8" stroke="#c9c1b4" stroke-width="1.5"/>
<rect x="580" y="196" width="68" height="20" rx="4" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="0"/>
<text x="614" y="211" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#fffdf8">Acceder</text>
<text x="472" y="282" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">Usuario, contraseña y permisos.</text>
<text x="472" y="306" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">Datos que no salen del edificio.</text>
<text x="472" y="330" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">Claves de otros sistemas.</text>
<rect x="48" y="362" width="784" height="112" rx="12" fill="#fffdf8" stroke="#1e3a5f" stroke-width="2"/>
<text x="72" y="394" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e2430">Dos objetos en el mismo expediente</text>
<text x="72" y="424" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2430">Cada uno con sus requisitos, su prueba de aceptación,</text>
<text x="72" y="452" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#1e2430">su formación y su garantía.</text>
<text x="812" y="438" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a4638">Descritos como uno solo, la oferta presupuesta el barato.</text>
</svg>
