<svg xmlns="http://www.w3.org/2000/svg" width="880" height="492" viewBox="0 0 880 492" role="img">
<title>Dos programas en el mismo pliego: el que se ve, sin nadie delante, y el que se usa para gestionarlo, con usuario y contraseña.</title>
<rect width="100%" height="100%" fill="#f3efe6"/>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#1e3a5f"/>
  </marker>
  <marker id="arrSoft" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#5c6b7a"/>
  </marker>
  <marker id="arrCoral" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 1.1 L 8.6 5 L 0 8.9 Z" fill="#9a4638"/>
  </marker>
</defs>
<rect x="48" y="56" width="360" height="190" rx="10" fill="#1e2430" stroke="#1e2430" stroke-width="0"/>
<rect x="60" y="68" width="336" height="166" rx="6" fill="#16222e" stroke="#0d1620" stroke-width="1.5"/>
<text x="80" y="100" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#9fb4c7">Avisos</text>
<rect x="80" y="114" width="290" height="32" rx="5" fill="#1e3340" stroke="#2a4152" stroke-width="1.5"/>
<text x="94" y="135" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#fffdf8">Aviso en la zona 2</text>
<rect x="80" y="156" width="290" height="32" rx="5" fill="#1e3340" stroke="#2a4152" stroke-width="1.5"/>
<text x="94" y="177" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#fffdf8">Obras en el acceso norte</text>
<text x="48" y="286" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e2430">El que se ve</text>
<text x="48" y="316" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">Nadie se identifica.</text>
<text x="48" y="340" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">No hay perfiles ni permisos.</text>
<text x="48" y="364" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">Se valida mirándolo.</text>
<rect x="472" y="56" width="360" height="190" rx="10" fill="#fffdf8" stroke="#2c333d" stroke-width="2"/>
<rect x="472" y="56" width="360" height="30" rx="10" fill="#2c333d" stroke="#2c333d" stroke-width="0"/>
<rect x="472" y="72" width="360" height="14" rx="0" fill="#2c333d" stroke="#2c333d" stroke-width="0"/>
<text x="652" y="77" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="400" fill="#fffdf8">Herramienta de gestión</text>
<rect x="562" y="104" width="180" height="122" rx="8" fill="#f3efe6" stroke="#c9c1b4" stroke-width="1.5"/>
<text x="580" y="132" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e2430">Entrar</text>
<rect x="580" y="144" width="144" height="20" rx="4" fill="#fffdf8" stroke="#c9c1b4" stroke-width="1.5"/>
<rect x="580" y="172" width="144" height="20" rx="4" fill="#fffdf8" stroke="#c9c1b4" stroke-width="1.5"/>
<rect x="580" y="198" width="68" height="20" rx="4" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="0"/>
<text x="614" y="213" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="700" fill="#fffdf8">Acceder</text>
<text x="472" y="286" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e2430">El que se usa para gestionarlo</text>
<text x="472" y="316" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">Usuarios, perfiles y permisos.</text>
<text x="472" y="340" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">Registro de quién hizo qué.</text>
<text x="472" y="364" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="400" fill="#3d4654">Se valida entrando.</text>
<rect x="48" y="396" width="784" height="68" rx="12" fill="#fffdf8" stroke="#1e3a5f" stroke-width="2"/>
<text x="440" y="428" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e2430">Dos programas. Casi siempre se describen como uno.</text>
<text x="440" y="452" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a4638">Y entonces la oferta presupuesta el que se ve.</text>
</svg>
